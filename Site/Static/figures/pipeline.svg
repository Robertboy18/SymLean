<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 318" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">How an answer becomes a theorem</title>
  <desc id="pipeline-desc">Three stages from left to right. Compute: an ordinary program searches for the antiderivative of atan x and proposes x atan x minus one half log of 1 plus x squared. Certificate: the proposal comes with the facts that make it right, a derivative residual that normalizes to 0 and the condition that 1 plus x squared is nonzero. Kernel check: a proof term of the theorem that the integral of atan from a to b is F of b minus F of a goes to Lean's kernel. The first two stages may be wrong, and a wrong proposal is refused; only the kernel is trusted.</desc>
  <defs>
    <marker id="pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="f-arrowhead" fill="#8d929a"/>
    </marker>
  </defs>

  <!-- 1. Compute -->
  <rect class="f-box" x="6" y="10" width="262" height="212" rx="8" fill="#ffffff" stroke="#e4e1d9" stroke-width="1.2"/>
  <circle class="f-dot" cx="32" cy="38" r="12" fill="#1f6f78"/>
  <text class="f-num" x="32" y="42.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">1</text>
  <text class="f-title" x="52" y="43" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1d232a">Compute</text>
  <text class="f-text" font-family="STIX Two Text, Georgia, serif" font-size="14.5" fill="#6a7078">
    <tspan x="22" y="74">An ordinary program searches for</tspan>
    <tspan x="22" y="94">an antiderivative of atan x and</tspan>
    <tspan x="22" y="114">proposes one:</tspan>
  </text>
  <rect class="f-code" x="20" y="130" width="234" height="34" rx="5" fill="#f4f2ec"/>
  <text class="f-mono" x="137" y="152" text-anchor="middle" font-family="JuliaMono, monospace" font-size="12.5" fill="#1d232a">x·atan(x) − ½·log(1 + x²)</text>
  <text class="f-tag" x="22" y="202" font-family="system-ui, sans-serif" font-size="12" fill="#8d929a">fast search, not trusted</text>

  <line class="f-arrow" x1="272" y1="116" x2="310" y2="116" stroke="#8d929a" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/>

  <!-- 2. Certificate -->
  <rect class="f-box" x="316" y="10" width="262" height="212" rx="8" fill="#ffffff" stroke="#e4e1d9" stroke-width="1.2"/>
  <circle class="f-dot" cx="342" cy="38" r="12" fill="#1f6f78"/>
  <text class="f-num" x="342" y="42.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">2</text>
  <text class="f-title" x="362" y="43" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1d232a">Certificate</text>
  <text class="f-text" font-family="STIX Two Text, Georgia, serif" font-size="14.5" fill="#6a7078">
    <tspan x="332" y="74">The proposal comes with the facts</tspan>
    <tspan x="332" y="94">that make it right:</tspan>
  </text>
  <rect class="f-code" x="330" y="110" width="234" height="54" rx="5" fill="#f4f2ec"/>
  <text class="f-mono" font-family="JuliaMono, monospace" font-size="12.5" fill="#1d232a">
    <tspan x="342" y="132">F′(x) − atan(x)  ⟶  0</tspan>
    <tspan x="342" y="152">1 + x² ≠ 0</tspan>
  </text>
  <text class="f-tag" x="332" y="202" font-family="system-ui, sans-serif" font-size="12" fill="#8d929a">data for the check</text>

  <line class="f-arrow" x1="582" y1="116" x2="620" y2="116" stroke="#8d929a" stroke-width="1.6" marker-end="url(#pipeline-arrow)"/>

  <!-- 3. Kernel check -->
  <rect class="f-box f-kernel" x="626" y="10" width="268" height="212" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <circle class="f-dot f-dot-kernel" cx="652" cy="38" r="12" fill="#2e7d4f"/>
  <text class="f-num" x="652" y="42.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">3</text>
  <text class="f-title" x="672" y="43" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1d232a">Kernel check</text>
  <text class="f-text" font-family="STIX Two Text, Georgia, serif" font-size="14.5" fill="#6a7078">
    <tspan x="642" y="74">A proof of the theorem goes to</tspan>
    <tspan x="642" y="94">Lean’s kernel, which checks it:</tspan>
  </text>
  <rect class="f-code" x="640" y="110" width="240" height="54" rx="5" fill="#f4f2ec"/>
  <text class="f-mono" font-family="JuliaMono, monospace" font-size="12.5" fill="#1d232a">
    <tspan x="652" y="132">∫ x in a..b, atan x</tspan>
    <tspan x="652" y="152">  = F(b) − F(a)</tspan>
  </text>
  <text class="f-tag f-tag-kernel" x="642" y="202" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2e7d4f">✓ the trusted step</text>

  <!-- What is trusted -->
  <path class="f-brace" d="M10,246 v10 h564 v-10" fill="none" stroke="#8d929a" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text class="f-text" x="292" y="282" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="14.5" fill="#6a7078">may be wrong; a proposal that fails its check is refused</text>
  <path class="f-brace f-brace-kernel" d="M630,246 v10 h260 v-10" fill="none" stroke="#2e7d4f" stroke-width="1.6"/>
  <text class="f-text" x="760" y="282" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="14.5" fill="#6a7078">what you trust</text>
  <text class="f-text" x="760" y="302" text-anchor="middle" font-family="STIX Two Text, Georgia, serif" font-size="14.5" fill="#6a7078">(and three standard axioms)</text>
</svg>
